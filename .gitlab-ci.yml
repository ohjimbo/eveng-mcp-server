# eveng-mcp-server pipeline — test → build → deploy
#
# Runner: shell executor (containerized gitlab-runner with docker CLI to the
# host daemon). The runner's checkout is NOT visible to the host daemon, so
# bind mounts (-v $CI_PROJECT_DIR:...) silently mount an empty dir — lint and
# tests therefore run inside `docker build` (the context is STREAMED to the
# daemon) via the Dockerfile's `test` stage.

stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: eveng-mcp
  CONTAINER_NAME: eveng-mcp

test:
  stage: test
  tags: [unraid]
  script:
    # ruff + pytest run inside this build stage
    - docker build --target test -t $IMAGE_NAME:test .

build:
  stage: build
  tags: [unraid]
  script:
    - docker build --target runtime -t $IMAGE_NAME:latest -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
  only:
    - main

deploy:
  stage: deploy
  tags: [unraid]
  script:
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    # host networking: junos-mcp-server listens on localhost:30030 on this
    # host, and MCP_PORT=8090 avoids clashing with mcp-homelab on 8080.
    - |
      docker run -d \
        --name $CONTAINER_NAME \
        --restart unless-stopped \
        --network host \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -e MCP_PORT=8090 \
        -e MCP_AUTH_TOKEN="${MCP_AUTH_TOKEN}" \
        -e EVENG_HOST="${EVENG_HOST}" \
        -e EVENG_USER="${EVENG_USER}" \
        -e EVENG_PASS="${EVENG_PASS}" \
        -e EVENG_PROTOCOL="${EVENG_PROTOCOL}" \
        -e CONSOLE_USER="${CONSOLE_USER}" \
        -e CONSOLE_PASS="${CONSOLE_PASS}" \
        -e OIDC_CONFIG_URL="${OIDC_CONFIG_URL}" \
        -e OIDC_CLIENT_ID="${OIDC_CLIENT_ID}" \
        -e OIDC_CLIENT_SECRET="${OIDC_CLIENT_SECRET}" \
        -e MCP_BASE_URL="${MCP_BASE_URL}" \
        -e IDRAC_HOST="${IDRAC_HOST}" \
        -e IDRAC_USER="${IDRAC_USER}" \
        -e IDRAC_PASS="${IDRAC_PASS}" \
        -e GITLAB_URL="${BACKUP_GITLAB_URL}" \
        -e GITLAB_TOKEN="${BACKUP_GITLAB_TOKEN}" \
        -e GITLAB_BACKUP_PROJECT="${GITLAB_BACKUP_PROJECT}" \
        -e JMCP_URL="${JMCP_URL}" \
        -e JMCP_DEVICE_USER="${JMCP_DEVICE_USER}" \
        -e JMCP_DEVICE_PASS="${JMCP_DEVICE_PASS}" \
        $IMAGE_NAME:latest
    - echo "Deployed $IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - sleep 5
    - docker logs --tail 30 $CONTAINER_NAME
    # the runner is a container itself, so curl its own localhost would miss
    # the host network — probe from inside the deployed container instead
    - docker exec $CONTAINER_NAME python -c "import urllib.request; assert urllib.request.urlopen('http://localhost:8090/health', timeout=5).read() == b'ok'; print('health ok')"
  only:
    - main
