[project]
name = "eveng-mcp-server"
version = "0.1.0"
description = "MCP server for EVE-NG: lab lifecycle, vendor-agnostic console access, derived inventory, and optional integrations (iDRAC, GitLab config backup, junos-mcp-server, NetBox)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "James Terry" }]
keywords = ["eve-ng", "mcp", "network-automation", "lab", "model-context-protocol"]
dependencies = [
    "fastmcp>=3.2,<4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "scrapli>=2024.1.30",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
eveng-mcp-server = "eveng_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eveng_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
